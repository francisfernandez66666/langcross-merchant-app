# ─────────────────────────────────────────────────────────────
# LangCross 商家店端：生产 nginx 配置
#
# 拓扑（nginx 是唯一对外端口 80/443）：
#   /api/*          → 反代 Go API（:8080）
#   其它一切路径     → SPA 静态产物 + history fallback（客人端深链 /s/{slug} 靠这个）
#
# ── 为什么压缩放这里而不是应用层 ──────────────────────────
# 应用层保持零依赖原则：Go 服务只干业务，压缩 / TLS / 缓存头这些
# 横切关注点交给网关。换网关（Caddy / CDN）不用改一行 Go 代码；
# 反过来若塞进应用，每个新接口都要记得过一遍中间件，漏一个就是
# 「某个接口没压缩」这种没人会发现的债。
# ★ 因此「API 直连 :8080 不带 Content-Encoding」是**设计如此**，
#   不是缺陷——压缩断言请在网关侧做（见 tools/indep_byte_uat.sh B6b）。
#
# ── 部署前置 ─────────────────────────────────────────────
#   1. cd web && npm run build        # 产物落到 web/dist
#   2. 本文件放到 /etc/nginx/conf.d/langcross.conf
#   3. 把 server_name 换成真实域名，TLS 段按需解注
#   4. API 以**非** LC_DEV 启动（生产必须显式给 LC_SECRET，见 config.go）
# ─────────────────────────────────────────────────────────────

# ── 上游：Go API ──────────────────────────────────────────────
upstream langcross_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── 限流：客人端公开接口的成本护栏 ────────────────────────────
# 应用层已有两级护栏（单 IP 30 次/分钟 + 单店 1000 次/天），但那是
# **进程内**计数——多实例部署各算各的。网关这层按真实来源 IP 计数，
# 是挡分布式脚本的第一道门。burst 给足：语音转写可能连着发几条。
limit_req_zone $binary_remote_addr zone=guest_assist:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m  rate=300r/m;

server {
    listen 80;
    server_name _;                 # 换成真实域名

    # 让 API 看到真实客户端 IP（应用层限流与埋点都依赖它）
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 压缩（P2-2）：只压文本类，图片/视频本身已编码 ──────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;          # 小响应压了反而变大的情况很常见
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/xhtml+xml image/svg+xml;

    # ── 客人端公开接口：/api/public/* ─────────────────────────
    # 不登录 → 直接暴露给公网，限流必须最严（见上方 zone 说明）
    location /api/public/ {
        limit_req zone=guest_assist burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://langcross_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;    # 模型调用可能十几秒，别把客人回答截断
    }

    # ── 其余 API ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://langcross_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 菜品图片上传上限：应用层 MaxImageBytes = 5MB，这里留余量
        client_max_body_size 8m;
        proxy_read_timeout 120s;   # 批量翻译可能跑一会儿
    }

    # ── SPA 静态产物 ─────────────────────────────────────────
    root /var/www/langcross/dist;  # web/dist 的部署位置
    index index.html;

    # 带 hash 的产物：长期强缓存（Vite 每次构建改名，不会读到旧的）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ★ history fallback：客人扫桌码进来是 /s/{slug}，这个路径磁盘上
    #   没有对应文件，必须回落 index.html 交给前端路由，否则深链 404。
    #   注意最后一个 URI 是 /index.html 而不是 =404——SPA 深链就靠它。
    location / {
        add_header Cache-Control "no-cache";   # index.html 不能强缓存，发版要立刻生效
        try_files $uri $uri/ /index.html;
    }

    # ── 安全头（本项目是 Bearer token 而非 Cookie，CSRF 风险本就不成立，
    #    这些头是纵深防御，不是补漏洞） ─────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志：记录真实 IP 与请求耗时，排障时不用再改配置
    access_log /var/log/nginx/langcross.access.log;
    error_log  /var/log/nginx/langcross.error.log warn;
}

